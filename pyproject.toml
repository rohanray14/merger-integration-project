[project]
name = "integrability"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "pandas", "pyarrow", "pyyaml", "requests", "beautifulsoup4", "lxml",
  "scikit-learn", "numpy", "tqdm", "matplotlib", "pytest",
]
[project.optional-dependencies]
gpu = ["torch", "transformers"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
